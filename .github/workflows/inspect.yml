name: Inspect (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      - run: >
          python scripts/archive.py --inspect
          "https://clickhouse.com/authors/ryadh-dahimene"
          "https://clickhouse.com/blog?author=ryadh-dahimene&page=2"
          "https://clickhouse.com/blog/clickpipes-is-generally-available"
          "https://clickhouse.com/blog/clickhouse-acquires-langfuse-open-source-llm-observability"
          "https://clickhouse.com/blog/cost-predictable-logging-with-clickhouse-vs-datadog-elastic-stack"
