name: Inspect (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspect.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/archive.py --inspect https://clickhouse.com/blog/clickpipes-amazon-kinesis --context "made a short video"
      - run: python scripts/archive.py --inspect https://clickhouse.com/blog/fivetran-destination-clickhouse-cloud --context "comprehensive documentation"
